name: Sync publications from ORCID

on:
  schedule:
    - cron: "0 13 * * 1"   # every Monday, 13:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync new publications from ORCID + Crossref
        run: python scripts/sync_publications.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/publications.bib; then
            echo "No new publications."
            exit 0
          fi
          git config user.name "publications-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/publications.bib
          git commit -m "Auto-sync: new publication(s) from ORCID"
          git push
